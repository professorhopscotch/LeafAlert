name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS build + unit tests (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone || true

      # `test` builds the app and runs the LeafAlertTests bundle, which covers the
      # safety-critical alert gating (ToxicityThresholds), the hedged detection copy,
      # and the bounding-box coordinate mapping. A regression in any of those either
      # withholds a warning about a toxic plant or points the user at the wrong spot,
      # so this gate blocks the merge rather than just warning.
      - name: Build and test (no code signing)
        run: |
          xcodebuild test \
            -scheme LeafAlert \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This job runs the LIGHT tests only: feedback-server security, feedback
      # ingestion, gait_check (numpy), and the pure-decision parts of the ML
      # tooling. Tests that need the ML stack (torch / timm / coremltools) call
      # pytest.importorskip at module top and are SKIPPED here, not failed —
      # the full requirements.txt pulls multi-hundred-MB wheels that are far too
      # heavy for this gate. Run the full suite locally in .venv.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pillow

      - name: Run tests
        run: pytest tests/ -v
