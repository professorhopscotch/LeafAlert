name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS build (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone || true

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -scheme LeafAlert \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build \
            CODE_SIGNING_ALLOWED=NO

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The lightweight tests in tests/ (feedback-server security + feedback
      # ingestion) are deliberately stdlib + pytest only — they do NOT import
      # torch / torchvision / coremltools / numpy. The full requirements.txt
      # pulls in multi-hundred-MB ML wheels that are far too heavy (and slow)
      # for this gate, so we install only pytest here and run the light suite.
      #
      # If/when a test needs the heavy stack, switch the line below to
      # `pip install -r requirements.txt` (expect a much longer install).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
